<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout optimizado C1 y C2</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f4f7fb}#loading{display:flex;height:100%;align-items:center;justify-content:center;font-size:18px;color:#17365d}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="loading">Cargando layout interactivo…</div><script>(async()=>{try{const r=await fetch('../layout-c1-c2/index.html?v=4',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo leer el archivo fuente');const src=await r.text();const m=src.match(/const b64='([^']+)'/);if(!m)throw new Error('No se encontró el contenido del layout');const b64=m[1].replace(/\s/g,'');const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const html=new TextDecoder('utf-8').decode(pako.ungzip(u8));document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="padding:30px;font-family:Arial"><h2>No se pudo cargar el layout</h2><p>'+String(e.message||e)+'</p></div>';console.error(e);}})();</script></body></html>
