<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout optimizado C1 y C2</title>
<style>
:root{--navy:#102a43;--blue:#2563eb;--muted:#64748b;--line:#d9e2ec;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033}
header{background:linear-gradient(120deg,#102a43,#1e4f7a);color:#fff;padding:24px 34px;box-shadow:0 4px 18px #0f172a22}header h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#dbeafe}
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.toolbar strong{margin-right:8px}.toolbar button{border:1px solid #b8c5d6;background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700;color:#234}.toolbar button.active{background:#17365d;color:#fff;border-color:#17365d}.toolbar span{margin-left:auto;color:#64748b;font-size:12px}
main{max-width:1560px;margin:auto;padding:24px}.panel{display:none}.panel.active{display:block}.panel-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.panel-head h2{font-size:27px;margin:4px 0}.panel-head p{margin:0;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:#2874a6}.badge{font-weight:800;background:#e8f2fb;border:1px solid #bcd5ea;border-radius:999px;padding:10px 16px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0 16px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:0 2px 8px #0f172a0b}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:800}.kpi-value{font-size:22px;font-weight:850;color:#17365d;margin-top:5px}.kpi-sub{font-size:11px;color:#7c8b9d;margin-top:3px}
.layout-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.canvas-card,.side-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #0f172a0d}.canvas-card{padding:8px;overflow:auto}.side-card{padding:18px}.side-card h3{margin:0 0 12px;font-size:15px;color:#17365d}.legend-row{display:flex;align-items:center;gap:9px;margin:8px 0;font-size:13px}.swatch{width:22px;height:15px;border-radius:3px;border:1px solid #8795a1;display:inline-block}.rack{background:#d49a52}.rec{background:#cfe8ff}.pick{background:#fff0b8}.disp{background:#d7f4d2}.aisle{background:#f8fafc;border-style:dashed;border-color:#2563eb}.small{font-size:12px;line-height:1.5;color:#5d6b7c}.mode-buttons{display:flex;gap:7px;flex-wrap:wrap}.mode{border:1px solid #b8c5d6;background:#fff;border-radius:8px;padding:8px 9px;cursor:pointer;font-size:12px;font-weight:800}.mode.active{background:#17365d;color:#fff;border-color:#17365d}.occ-box{background:#edf5fc;border:1px solid #c9deee;border-radius:11px;padding:13px;margin-top:12px;text-align:center}.occ-title{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}.occ-number{font-size:28px;font-weight:900;color:#17365d;margin:4px 0}.occ-note{font-size:11px;color:#64748b}.note{background:#fff7df;border:1px solid #f1d48a;border-radius:10px;padding:11px;font-size:11px;line-height:1.45;margin-top:13px}
svg{width:100%;min-width:840px;height:auto;display:block}.floor{fill:#f8fafc;stroke:#172033;stroke-width:3}.storage{fill:#edf3f8}.zone{stroke:#64748b;stroke-width:1}.slot{fill:#d49a52;stroke:#7b5429;stroke-width:.55}.slot.empty{fill:#f6f8fb;stroke:#d6dee8;opacity:.45}.zone-title{font-size:13px;font-weight:800;fill:#23364d}.zone-area{font-size:11px;font-weight:700;fill:#41556e}.storage-title{font-size:13px;font-weight:900;fill:#17365d}.aisle-line{stroke:#2563eb;stroke-width:2;stroke-dasharray:8 6}.aisle-label{font-size:10px;fill:#2563eb;font-weight:800}.dim{font-size:11px;fill:#52667a;font-weight:800}.lane-label{font-size:7px;fill:#6b4f2a;font-weight:700}.maneuver{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5}.maneuver-text{font-size:10px;fill:#b91c1c;font-weight:800}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.layout-wrap{grid-template-columns:1fr}}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{padding:12px}.toolbar span{display:none}main{padding:12px}}
</style>
</head>
<body>
<header><h1>Layout optimizado — Centros de Distribución 1 y 2</h1><p>Plano interactivo de capacidad instalada · rack profundo 8 pallets · 4 niveles · pasillos mínimos conservados</p></header>
<div class="toolbar"><strong>Centro:</strong><button id="tab-C1" class="active" onclick="showCenter('C1')">Centro 1</button><button id="tab-C2" onclick="showCenter('C2')">Centro 2</button><span>Pasa el cursor sobre un pallet para ver carril y profundidad.</span></div>
<main id="app"></main>
<script>
const centers={
 C1:{name:'Centro de Distribución 1',dims:'69.4 × 51.4 m',area:'3.565 m²',lanes:82,cols:656,capacity:2624,occ:'50.1%',forks:2,rec:265,pick:371,disp:318,storage:2610,mainAisle:'9.22 m ≥ 4,20 m',maneuver:true},
 C2:{name:'Centro de Distribución 2',dims:'54.6 × 45.5 m',area:'2.483 m²',lanes:57,cols:456,capacity:1824,occ:'50.2%',forks:1,rec:185,pick:259,disp:222,storage:1818,mainAisle:'4.91 m ≥ 4,20 m',maneuver:false}
};
function kpi(label,value,sub=''){return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`}
function buildPanel(cid,c){return `<section class="panel" id="panel-${cid}"><div class="panel-head"><div><div class="eyebrow">LAYOUT OPTIMIZADO · CAPACIDAD INSTALADA</div><h2>${c.name}</h2><p>Vista superior interactiva. Todos los pallets dibujados representan posiciones físicas disponibles del rack.</p></div><div class="badge">${c.dims}</div></div><div class="kpis">${kpi('Área cubierta',c.area)}${kpi('Carriles profundos',c.lanes,'8 pallets de profundidad')}${kpi('Columnas de pallet en planta',c.cols,'cada una con 4 niveles')}${kpi('Capacidad instalada',c.capacity.toLocaleString('es-EC'),'posiciones pallet')}${kpi('Ocupación estática actual',c.occ,'según inventario medio estimado')}${kpi('Montacargas previstos',c.forks,'modelo preliminar')}</div><div class="layout-wrap"><div class="canvas-card"><svg id="svg-${cid}" viewBox="0 0 1000 720" role="img" aria-label="${c.name} layout"></svg></div><aside class="side-card"><h3>Lectura del plano</h3><div class="legend-row"><span class="swatch rack"></span>Pallets / rack profundo</div><div class="legend-row"><span class="swatch rec"></span>Recepción</div><div class="legend-row"><span class="swatch pick"></span>Picking</div><div class="legend-row"><span class="swatch disp"></span>Despacho</div><div class="legend-row"><span class="swatch aisle"></span>Pasillos de circulación</div><hr><h3>Modo de ocupación visual</h3><div class="small">Por defecto se muestran todas las posiciones físicas como ocupadas para visualizar la <b>capacidad máxima instalada</b>. Cambia a 85% para simular una operación con holgura.</div><div class="mode-buttons"><button class="mode active" data-mode="100" onclick="setOccupancy('${cid}',100)">100% capacidad</button><button class="mode" data-mode="85" onclick="setOccupancy('${cid}',85)">85% operativo</button></div><div class="occ-box"><div class="occ-title">Posiciones visibles</div><div class="occ-number" id="occ-${cid}">${c.capacity.toLocaleString('es-EC')}</div><div class="occ-note">posiciones verticales equivalentes</div></div><div class="note"><b>Importante:</b> 100% en esta vista significa que se representan todos los espacios físicos del rack. No implica recomendar operar el almacén permanentemente al 100% de ocupación.</div></aside></div></section>`}
function svgEl(tag,attrs={},text=''){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
function addText(svg,x,y,text,cls,anchor='middle'){svg.appendChild(svgEl('text',{x,y,class:cls,'text-anchor':anchor},text))}
function draw(cid,c){const svg=document.getElementById('svg-'+cid);const X=45,Y=45,W=910,H=610,zoneH=150,storageH=H-zoneH;svg.appendChild(svgEl('rect',{x:X,y:Y,width:W,height:H,rx:4,class:'floor'}));svg.appendChild(svgEl('rect',{x:X,y:Y,width:W,height:storageH,class:'storage'}));const totalZone=c.rec+c.pick+c.disp;const rw=W*c.rec/totalZone,pw=W*c.pick/totalZone,dw=W-rw-pw;const zy=Y+storageH;[['#cfe8ff',rw,'RECEPCIÓN',c.rec],['#fff0b8',pw,'PICKING / PREPARACIÓN',c.pick],['#d7f4d2',dw,'DESPACHO',c.disp]].reduce((x,z)=>{svg.appendChild(svgEl('rect',{x,y:zy,width:z[1],height:zoneH,fill:z[0],class:'zone'}));addText(svg,x+z[1]/2,zy+62,z[2],'zone-title');addText(svg,x+z[1]/2,zy+88,z[3]+' m²','zone-area');return x+z[1]},X);if(c.maneuver){svg.appendChild(svgEl('rect',{x:X+W-rw*0.85,y:zy+18,width:130,height:110,class:'maneuver'}));addText(svg,X+W-rw*0.85+65,zy+68,'MANIOBRA','maneuver-text');addText(svg,X+W-rw*0.85+65,zy+86,'12 × 12 m','maneuver-text')}addText(svg,X+W/2,Y+24,`ALMACENAMIENTO · ${c.storage} m²`,'storage-title');addText(svg,X+W/2,Y+H+28,c.dims.split('×')[0].trim(),'dim');addText(svg,X-28,Y+H/2,c.dims.split('×')[1].trim(),'dim');const blocks=cid==='C1'?4:3,gaps=blocks-1,aisleW=54,padX=55,padY=55,rackAreaW=W-2*padX-gaps*aisleW,blockW=rackAreaW/blocks,rackAreaH=storageH-2*padY;let remaining=c.lanes,laneNo=1,slots=[];for(let b=0;b<blocks;b++){const lanesHere=Math.ceil(remaining/(blocks-b));remaining-=lanesHere;const bx=X+padX+b*(blockW+aisleW);const laneW=blockW/lanesHere;for(let l=0;l<lanesHere;l++){const lx=bx+l*laneW;if(l%5===0)addText(svg,lx+laneW/2,Y+padY-8,'L'+laneNo,'lane-label');for(let d=0;d<8;d++){const sh=rackAreaH/8;const r=svgEl('rect',{x:lx+1.2,y:Y+padY+d*sh+1.2,width:Math.max(3,laneW-2.4),height:sh-2.4,rx:1,class:'slot','data-idx':slots.length});const t=svgEl('title',{},`${cid} · Carril ${laneNo} · Profundidad ${d+1} · 4 niveles verticales`);r.appendChild(t);svg.appendChild(r);slots.push(r)}laneNo++}if(b<blocks-1){const ax=bx+blockW+aisleW/2;svg.appendChild(svgEl('line',{x1:ax,y1:Y+34,x2:ax,y2:Y+storageH-18,class:'aisle-line'}));addText(svg,ax,Y+storageH/2,'3,80 m','aisle-label')}}svg.appendChild(svgEl('line',{x1:X+30,y1:Y+storageH-28,x2:X+W-30,y2:Y+storageH-28,class:'aisle-line'}));addText(svg,X+W/2,Y+storageH-35,'PASILLO PRINCIPAL '+c.mainAisle,'aisle-label')}
function showCenter(cid){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));document.getElementById('panel-'+cid).classList.add('active');document.getElementById('tab-'+cid).classList.add('active')}
function setOccupancy(cid,pct){const panel=document.getElementById('panel-'+cid),slots=[...panel.querySelectorAll('.slot')];slots.forEach((el,i)=>el.classList.toggle('empty',pct===85&&(i%20===0||i%20===7||i%20===13)));panel.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));panel.querySelector(`.mode[data-mode="${pct}"]`).classList.add('active');const visible=pct===100?slots.length:slots.filter((_,i)=>!(i%20===0||i%20===7||i%20===13)).length;document.getElementById('occ-'+cid).textContent=(visible*4).toLocaleString('es-EC')}
document.getElementById('app').innerHTML=Object.entries(centers).map(([id,c])=>buildPanel(id,c)).join('');Object.entries(centers).forEach(([id,c])=>draw(id,c));showCenter('C1');
</script>
</body></html>
