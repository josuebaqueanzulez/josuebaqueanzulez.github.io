<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sistema Intermodal Adaptativo Guayaquil–Cuenca</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#eef3f7;color:#173047}
    #loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:620px;background:#fff;border:1px solid #d7e1e8;border-radius:14px;padding:22px;box-shadow:0 8px 26px #102f4a18}
    .muted{font-size:13px;color:#617686;margin-top:7px}
    .err{white-space:pre-wrap;text-align:left;background:#fff1f1;border:1px solid #e3aaaa;border-radius:10px;padding:12px;margin-top:14px;color:#7d2020;font-size:12px}
  </style>
</head>
<body>
<div id="loading"><div class="box"><b>Cargando Sistema Intermodal Adaptativo…</b><div class="muted" id="status">Preparando archivos del visor.</div></div></div>
<script>
(async()=>{
  const files=Array.from({length:16},(_,i)=>`chunk${String(i+1).padStart(2,'0')}.b64`);
  const status=document.getElementById('status');
  const arrays=[];
  let total=0;

  for(let i=0;i<files.length;i++){
    const f=files[i];
    status.textContent=`Cargando ${f} (${i+1}/${files.length})…`;
    const r=await fetch(`${f}?v=2`,{cache:'no-store'});
    if(!r.ok) throw new Error(`No se pudo descargar ${f}: HTTP ${r.status}`);
    let txt=await r.text();
    txt=txt.replace(/[^A-Za-z0-9+/=]/g,'');
    if(!txt) throw new Error(`${f} está vacío después de limpiar el Base64.`);
    try{
      const bin=atob(txt);
      const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
      arrays.push(bytes);
      total+=bytes.length;
    }catch(e){
      throw new Error(`Base64 inválido en ${f}: ${e.message}`);
    }
  }

  status.textContent='Reconstruyendo visor…';
  const all=new Uint8Array(total);
  let offset=0;
  for(const a of arrays){ all.set(a,offset); offset+=a.length; }
  const html=new TextDecoder('utf-8',{fatal:false}).decode(all);
  if(!/<html[\s>]/i.test(html) || !/<\/html>/i.test(html)){
    throw new Error('Los fragmentos se descargaron, pero el HTML reconstruido no parece completo.');
  }
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  const root=document.getElementById('loading')||document.body;
  root.innerHTML=`<div class="box"><b>No se pudo cargar el dashboard.</b><div class="muted">El mensaje de abajo identifica el punto exacto del fallo.</div><div class="err">${String(e && e.message ? e.message : e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</div></div>`;
});
</script>
</body>
</html>
