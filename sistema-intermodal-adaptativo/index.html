<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Intermodal Adaptativo Guayaquil–Cuenca</title></head><body>
<script>
(async()=>{
  const files=['chunk01.b64','chunk02.b64','chunk03.b64','chunk04.b64','chunk05.b64','chunk06.b64','chunk07.b64','chunk08.b64','chunk09.b64','chunk10.b64','chunk11.b64','chunk12.b64','chunk13.b64','chunk14.b64','chunk15.b64','chunk16.b64'];
  const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
  const bin=atob(parts.join(''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const html=new TextDecoder('utf-8').decode(bytes);
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="font-family:system-ui;padding:20px">No se pudo cargar el dashboard: '+e.message+'</pre>'});
</script></body></html>
